queue-server: "queue"
main-server: "main"
main-server-slots: 100
messages:
  interval: 10 #In seconds
  server-full: "&88b8t is full"
  queue-position: "&8Position in queue: &l%d"
  queue-end: "&8Connecting to 8b8t..."
#this shows the queue size when you hover over the ping on the server list
custom-query:
  enable: true
  query:
    - "&78b&98t &8Queue Info"
    - "&8Priority: &l%priority%"
    - "&8Regular: &l%regular%"
    - "&8Total in queue: &l%totalinqueue%"
    - "&8Max players on main server: &l%maxplayers%"
    - "&8Donate to receive priority queue at &chttps://donate.8b8t.me"
  protocol-message: "&78b&98t &81.7.X to 1.21.X"
  #-1 for +1 mode i.e 30/31 online
  max-players: -1
tablist:
  header:
    - ""
    - "&7&l8builders&9&l8tools"
    - ""
    - "&88b8t is full"
    - "Position in queue: &l%position%"
    - "&8Estimated time: &l%wait%"
    - ""
  priority-queue-footer:
    - ""
    - "&8You have priority queue status please wait for an available slot on the server"
    - "&8Contact: contact@8b8t.me"
    - "&8Discussion: http://discord.8b8t.me"
    - "&8Website: https://www.8b8t.me"
    - "&8These are the only official &78b&98t&8 websites and contacts"
    - ""
  normal-queue-footer:
    - ""
    - "&8You can now donate to receive priority queue status, please visit donate.8b8t.me"
    - "&8Contact: contact@8b8t.me"
    - "&8Discussion: http://discord.8b8t.me"
    - "&8Website: https://www.8b8t.me"
    - "&8These are the only official &78b&98t&8 websites and contacts"
    - ""